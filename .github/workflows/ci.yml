name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Swift tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

  macos:
    name: Tests and app (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run package tests
        run: swift test

      - name: Build macOS app
        run: |
          xcodebuild \
            -project App/OpenDock.xcodeproj \
            -scheme OpenDock \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
