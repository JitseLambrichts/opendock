name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Swift tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

  macos:
    name: Swift tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # Package tests only. The Xcode app is a follow-up; do not xcodebuild
      # or fail this job if App/OpenDock.xcodeproj is missing.
      - name: Run tests
        run: swift test
